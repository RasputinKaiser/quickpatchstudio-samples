    <rect x="134" y="322" width="244" height="20" rx="10" fill="#f2c078"/>
    <rect x="134" y="365" width="264" height="72" rx="14" fill="#24455a"/>
    <text x="156" y="409" font-size="22" font-weight="700" fill="#fffdfa">Stripe fix</text>
    <rect x="134" y="458" width="264" height="72" rx="14" fill="#24455a"/>
    <text x="156" y="502" font-size="22" font-weight="700" fill="#fffdfa">Landing polish</text>
    <rect x="134" y="552" width="184" height="22" rx="11" fill="#d8dde6"/>
    <rect x="474" y="232" width="334" height="380" rx="18" fill="#eef7f5"/>
    <text x="504" y="286" font-size="24" font-weight="800" fill="#1f7a8c">Scope Signals</text>
    <rect x="504" y="326" width="242" height="58" rx="12" fill="#fffdfa"/>
    <text x="526" y="363" font-size="20" font-weight="800" fill="#151515">No secrets needed</text>
    <rect x="504" y="408" width="242" height="58" rx="12" fill="#fffdfa"/>
