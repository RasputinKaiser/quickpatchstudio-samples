<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">Micro-app sample preview</title>
  <desc id="desc">A compact job triage dashboard with project cards, risk flags, and a delivery estimate panel.</desc>
  <rect width="1280" height="800" fill="#f3efe7"/>
  <rect x="64" y="64" width="1152" height="672" rx="28" fill="#fffdfa" stroke="#d8dde6" stroke-width="4"/>
  <text x="104" y="138" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="850" fill="#151515">Quick Scope Micro-App</text>
  <text x="106" y="184" font-family="Inter, Arial, sans-serif" font-size="24" fill="#5d6470">Tiny client-facing tools for triage, pricing, intake, and internal workflow cleanup.</text>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="104" y="232" width="334" height="380" rx="18" fill="#15232b"/>
