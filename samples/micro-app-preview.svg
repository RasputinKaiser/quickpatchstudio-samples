    <text x="874" y="286" font-size="24" font-weight="800" fill="#a45e31">Delivery</text>
    <text x="874" y="364" font-size="70" font-weight="850" fill="#151515">1 day</text>
    <text x="878" y="410" font-size="23" fill="#5d6470">first useful version</text>
    <rect x="874" y="474" width="188" height="62" rx="31" fill="#1f7a8c"/>
    <text x="916" y="514" font-size="22" font-weight="850" fill="#fffdfa">open app</text>
